name: Bug 汇报
description: 报告构建失败、页面错误或行为异常
title: "fix: "
labels:
  - type: bug
body:
  - type: markdown
    attributes:
      value: |
        请尽量提供可复现的信息，便于快速定位问题。

  - type: textarea
    id: summary
    attributes:
      label: 问题摘要
      description: 用一两句话说明出了什么问题
      placeholder: 例如：首页在移动端导航无法展开
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 出现环境
      description: 问题出现在哪里？
      options:
        - 本地开发（npm run dev）
        - 生产构建（npm run build）
        - CI / GitHub Actions
        - 已部署站点
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 相关版本（可选）
      description: Node 版本、分支名、commit hash 或部署版本
      placeholder: 例如：Node 22.12.0，分支 chore/bootstrap-astro-site

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何一步步触发这个问题？
      placeholder: |
        1. npm install
        2. npm run dev
        3. 打开 http://localhost:4321/...
        4. 点击...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为正确的结果应该是什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？如有报错请粘贴完整信息
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或日志（可选）
      description: 可粘贴截图、浏览器控制台或 CI 日志片段

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已在最新 main 或目标分支上复现（或说明无法复现的原因）
        - label: 我已搜索现有 Issue，确认没有重复报告
