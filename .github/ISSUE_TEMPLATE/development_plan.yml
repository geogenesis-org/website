name: 开发计划
description: 规划待实现的功能、页面或设计方案
title: "feat: "
labels:
  - type: feature
body:
  - type: markdown
    attributes:
      value: |
        用于在开发前对齐目标、范围与验收标准。合并前通常需对应 PR 并关联本 Issue。

  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 打算实现什么功能或设计？解决什么问题？
      placeholder: 例如：定制 GeoGenesis 首页 Hero 区块
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 本 Issue 包含哪些具体工作项？可用 checklist 形式
      placeholder: |
        - [ ] 更新 src/data/site.ts 导航与 Hero 文案
        - [ ] 替换 public/brand/ 占位 Logo
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 怎样算完成？
      placeholder: |
        - [ ] npm run dev 可正常预览
        - [ ] npm run build 与 npm run check 通过
        - [ ] ...
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: 建议分支名
      placeholder: feat/customize-home-hero

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - P0 — 急需，阻塞其他工作
        - P1 — 近期需要
        - P2 — 可排期
        - P3 — 想法 / 远期
    validations:
      required: true
